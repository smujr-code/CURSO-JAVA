<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación de Productos</title>

    <!-- BOOTSTRAP -->
<link rel="stylesheet" href="bootstrap.min.css">
</head>
<body>

    <nav class="navbar navbar-light bg-light">
        <a href="/" class="navbar-brand">Aplicación de Productos</a>
    </nav>

    <div class="container">

        <!-- APLICACIÓN -->
        <div id="App" class="row pt-5">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h4>Agregar un Producto</h4>
                    </div>

                    <form id="product-form" class="card-body">

                        <div class="form-group">
                            <input type="text" id="name" placeholder="Nombre del producto" class="form-control">
                        </div>

                        <div class="form-group">
                            <input type="number" step="0.01" id="price" placeholder="Precio del producto"
                             class="form-control">
                        </div>

                        <div class="form-group">
                            <input type="number" id="year" value="2026" min="2026" max="2030" placeholder="Año del producto"
                            class="form-control">
                        </div>

                        <input type="submit" value="Guardar" class="btn btn-primary btn-block">
                    </form>

                </div>
            </div>

            <div class="col-md-8">
                <div id="product-list"></div>
            </div>

        </div>

    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
